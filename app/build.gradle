plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.objectdetection'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.objectdetection"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        vectorDrawables.useSupportLibrary = true

        Properties localProperties = new Properties()
        File localPropertiesFile = project.rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        def apiKey = System.getenv("GEMINI_API_KEY") ?: localProperties.getProperty("GEMINI_API_KEY", "")
        buildConfigField "String", "GEMINI_API_KEY", "\"$apiKey\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ARCore for 3D Spatial Mapping
    implementation 'com.google.ar:core:1.41.0'

    // ML Kit Object Detection
    implementation 'com.google.mlkit:object-detection:17.0.2'

    // ML Kit Text Recognition (OCR)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // OpenCV for Android
    implementation 'org.opencv:opencv:4.9.0'

    // Guava / Task support
    implementation 'com.google.guava:guava:31.1-android'

    // On Device Machine Learning Image
    implementation 'com.google.android.odml:image:1.0.0-beta1'

    // Google GenAI SDK (Gemini API)
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'
    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.ar:core:1.56.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
}
